# Builds the Docker image on every push to main and publishes it to Docker Hub as :latest
# (linux/amd64 and linux/arm64). Needs repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN.
name: Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: patatties/auditrack

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Version label
        id: version
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:latest
          build-args: |
            APP_VERSION=latest (${{ steps.version.outputs.short_sha }})
          labels: |
            org.opencontainers.image.title=audiTrack
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Docker Hub description = README. Off by default: it needs a token with "Read, Write, Delete"
      # access. Turn it on with the repository variable DOCKERHUB_UPDATE_DESCRIPTION = true
      # (Settings -> Secrets and variables -> Actions -> Variables).
      - name: Update Docker Hub description
        if: vars.DOCKERHUB_UPDATE_DESCRIPTION == 'true'
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE }}
          short-description: "Audit findings tracker for audit teams — self-hosted, one container, built-in database."
          readme-filepath: ./README.md
